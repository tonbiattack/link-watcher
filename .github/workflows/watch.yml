name: Watch

on:
  schedule:
    # Every 30 minutes. GitHub may delay scheduled runs under load.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report changes without notifying"
        type: boolean
        default: false
      no_seed:
        description: "Notify about links already present instead of seeding"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Check configuration
        id: config
        env:
          WATCH_URL: ${{ vars.WATCH_URL }}
        run: |
          if [ -z "${WATCH_URL}" ]; then
            echo "::notice::WATCH_URL is not set. Add it under Settings > Secrets and variables > Actions > Variables. Skipping this run."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      # The watcher keeps its snapshot between runs. A cache avoids committing
      # state back into the repository on every single run.
      - name: Restore previous snapshot
        if: steps.config.outputs.skip != '1'
        uses: actions/cache@v6
        with:
          path: .linkwatch
          key: linkwatch-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            linkwatch-${{ github.ref_name }}-

      - uses: actions/setup-python@v7
        if: steps.config.outputs.skip != '1'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        if: steps.config.outputs.skip != '1'
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Watch page
        if: steps.config.outputs.skip != '1'
        env:
          WATCH_URL: ${{ vars.WATCH_URL }}
          WATCH_SELECTOR: ${{ vars.WATCH_SELECTOR }}
          WATCH_IGNORE: ${{ vars.WATCH_IGNORE }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
          WATCH_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          WATCH_NO_SEED: ${{ inputs.no_seed && '1' || '' }}
        run: link-watcher -v
