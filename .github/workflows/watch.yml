name: Watch

on:
  schedule:
    # Every 30 minutes. GitHub may delay scheduled runs under load.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report changes without notifying"
        type: boolean
        default: false
      no_seed:
        description: "Notify about links already present (ignore the seed rule)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Watch page
        env:
          WATCH_URL: ${{ vars.WATCH_URL }}
          WATCH_SELECTOR: ${{ vars.WATCH_SELECTOR }}
          WATCH_IGNORE: ${{ vars.WATCH_IGNORE }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
          WATCH_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          WATCH_NO_SEED: ${{ inputs.no_seed && '1' || '' }}
        run: link-watcher -v

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .linkwatch/state.json
          if git diff --cached --quiet; then
            echo "No state change"
            exit 0
          fi
          git commit -m "chore: update watch state"
          git pull --rebase
          git push
